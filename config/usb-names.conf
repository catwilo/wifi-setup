# wifi-setup -- USB WiFi interface naming
#
# Maps a WiFi USB adapter's PERMANENT MAC (factory MAC, stable across
# reboots and MAC spoofing) to a fixed interface name. Systemd-udevd
# applies the rename on boot via /etc/systemd/network/10-wifi-setup-<name>.link.
#
# One mapping per line:  <mac>  <name>
# Lines starting with # are ignored. Blank lines are ignored.
#
# Change here to rename, add lines to name more adapters. Reinstall
# (wifi install) after editing; the rename applies on the next boot.
#
# Example:
#   90:de:80:e7:fd:9f   wlx1
#   aa:bb:cc:dd:ee:ff   wlx2

90:de:80:e7:fd:9f wlx1
